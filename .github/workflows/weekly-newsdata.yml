name: Weekly NewsData update

on:
  schedule:
    # Mondays at 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate NewsData secret
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: |
          if [ -z "$NEWSDATA_API_KEY" ]; then
            echo "::error::NEWSDATA_API_KEY is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [[ "$NEWSDATA_API_KEY" == *"="* ]]; then
            echo "::error::Secret looks like a full env line. Paste only the key value (pub_...), not NEWSDATA_API_KEY=..."
            exit 1
          fi
          if [[ "$NEWSDATA_API_KEY" =~ ^[[:space:]] || "$NEWSDATA_API_KEY" =~ [[:space:]]$ ]]; then
            echo "::error::Secret has leading or trailing spaces. Re-save it with no spaces before or after the key."
            exit 1
          fi

      - name: Fetch NewsData snapshot
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: node scripts/fetch-newsdata.mjs --delay 2000

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blindspot-history.json data/coverage-gaps.json data/snapshots.json data/source.json data/newsdata-domains.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Refresh live coverage data (automated weekly NewsData snapshot)."
          git push
